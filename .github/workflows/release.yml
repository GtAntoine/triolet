# Publishes the three packages to npm when a version tag is pushed (v0.1.0, v0.2.0, ...).
#
# It does nothing until the repository has an NPM_TOKEN secret and a tag is pushed: see
# docs/releasing.md. The token must be an npm automation or granular access token allowed to
# publish these packages; this workflow never creates it. Third-party actions are pinned by
# commit hash (the comment names the version).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'GtAntoine/triolet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: The tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm icon:check
      - run: pnpm test
      - run: pnpm build
      - name: Check the tarballs and the version
        run: node tools/release.ts check --tag "$GITHUB_REF_NAME"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          test -n "$NODE_AUTH_TOKEN" || { echo "The NPM_TOKEN secret is not set."; exit 1; }
          pnpm --filter triolet publish --access public --provenance --no-git-checks
          pnpm --filter triolet-react publish --access public --provenance --no-git-checks
          pnpm --filter triolet-react-native publish --access public --provenance --no-git-checks
