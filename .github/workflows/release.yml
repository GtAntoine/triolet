# Publishes the three packages to npm when a version tag is pushed (v0.1.0, v0.2.0, ...).
#
# It publishes with npm Trusted Publishing (OIDC): npm trusts this repository and this workflow
# file for each of the three packages, so no token is needed (see docs/releasing.md for the
# setting to make on npmjs.com). The NPM_ACCESS_TOKEN secret, if there is one, is only a fallback
# for a package whose trusted publisher is not set yet. This workflow never creates tokens.
# Third-party actions are pinned by commit hash (the comment names the version).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'GtAntoine/triolet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: The tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm icon:check
      - run: pnpm test
      - run: pnpm build
      - name: Check the tarballs and the version
        run: node tools/release.ts check --tag "$GITHUB_REF_NAME"
      - name: Publish
        env:
          # Only the fallback. Without a secret a placeholder keeps the .npmrc that setup-node
          # writes valid, and the OIDC exchange of Trusted Publishing does the authentication.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN || 'trusted-publishing' }}
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          # In order: a package comes after the one it depends on. A version that is already on
          # the registry is skipped, so a run that stopped half way can simply be run again.
          for name in triolet triolet-react triolet-react-native; do
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already published: skipped."
            else
              pnpm --filter "$name" publish --access public --provenance --no-git-checks
            fi
          done
